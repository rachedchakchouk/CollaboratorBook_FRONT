<pre>{{ formLogin.value | json }}</pre>
<div class="container-fluid px-1 px-md-5 px-lg-1 px-xl-5 py-5 mx-auto">
  <div class="card card0 border-0">
    <div class="row d-flex">
      <div class="col-lg-6">
        <div class="card1 pb-5">
          <div class="row">
            <img src="https://i.imgur.com/CXQmsmF.png" class="logo" />
          </div>
          <div class="row px-3 justify-content-center mt-4 mb-5 border-line">
            <img src="https://i.imgur.com/uNGdWHi.png" class="image" />
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="card2 card border-0 px-4 py-5">
          <!--          (ngSubmit)="login(loginForm)"-->
          <form
            class="form-signin"
            [formGroup]="formLogin"
            (ngSubmit)="login()"
          >
            >
            <div class="container-fluid">
              <h2 class="form-signin-heading">Login</h2>
              <div *ngIf="invalidLogin" class="alert alert-danger">
                Invalid username or password.
              </div>
              <br />
              <label for="username" class="sr-only">User Name</label>
              <input
                type="email"
                id="username"
                name="username"
                formControlName="username"
                class="form-control"
                placeholder="User Name"
                required
                autofocus
              />
              <br />
              <label for="password" class="sr-only">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                formControlName="password"
                class="form-control"
                placeholder="Password"
                required
              />
              <br />
              <button class="btn btn-lg btn-primary btn-block" type="submit">
                Sign in
              </button>
            </div>
          </form>
          <div class="row px-3 mb-4">
            <div class="custom-control custom-checkbox custom-control-inline">
              <input
                id="chk1"
                type="checkbox"
                name="chk"
                class="custom-control-input"
              />
              <label for="chk1" class="custom-control-label text-sm"
                >Remember me</label
              >
            </div>
            <a href="#" class="ml-auto mb-0 text-sm">Forgot Password?</a>
          </div>
          <!--          -->
          <div class="row mb-4 px-3">
            <small class="font-weight-bold"
              >Don't have an account?
              <a class="text-danger" href="http://localhost:4200/signup"
                >Register</a
              ></small
            >
          </div>
        </div>
      </div>
    </div>
    <div class="bg-blue py-4">
      <div class="row px-3">
        <small class="ml-4 ml-sm-5 mb-2"
          >Copyright &copy; 2022. All rights reserved.</small
        >
      </div>
    </div>
  </div>
</div>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js</script>"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js</script>"></script>
