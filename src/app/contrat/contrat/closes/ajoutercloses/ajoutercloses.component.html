
    <div class="container">
        <div class="row">
            <h2>Add Clause</h2>
            <div class="col-md-7 col-md-offset-2">
    


                    <form class="form">
                       
                        <div class="form-group">
                            <label class="sr-only">title</label>
                            <h5>Clause title</h5>
                            <input type="text" class="form-control" name="clauseTitle"required="" id="clauseTitle" placeholder="Clause Title" [(ngModel)]="clause.title" >
                        </div>
                        <div class="form-group">
                            <label class="sr-only">Name</label>
                            <h5>Clause</h5>
                            <textarea rows="5" type="text" cols="30" name="clauseDiscription"  id="clauseDiscription" pInputTextarea="true"  [(ngModel)]="clause.description">
                                
                            </textarea>                      
                          </div>
                        <button type="submit" class="btn text-center btn-blue"(click)="addClause()">Save Clause</button>
                    </form>
                </div>
            </div>
        </div>
