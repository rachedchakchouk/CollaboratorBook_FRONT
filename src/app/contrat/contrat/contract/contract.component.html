<p-toast></p-toast>

<div class="card">
  <p-toolbar styleClass="mb-4 gap-2">
    <ng-template pTemplate="left">
      <button
        pButton
        pRipple
        label="New"
        icon="pi pi-plus"
        class="p-button-success mr-2"
        (click)="openNew()"
      ></button>
      <button
        pButton
        pRipple
        icon="pi pi-trash"
        class="p-button-danger"
        (click)="deleteSelectedcContract()"
        [disabled]="!selectedcontracts || !selectedcontracts.length"
      ></button>
    </ng-template>
  </p-toolbar>

  <p-table
    #dt
    [value]="contracts"
    [rows]="10"
    [paginator]="true"
    [globalFilterFields]="[
      'id',
      'startDate',
      'grossSalary',
      'contractType',
      'duration'
    ]"
    [tableStyle]="{ 'min-width': '75rem' }"
    [(selection)]="selectedcontracts"
    [rowHover]="true"
    dataKey="id"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [showCurrentPageReport]="true"
  >
    <ng-template pTemplate="caption">
      <div class="flex align-items-center justify-content-between">
        <h5 class="m-0">Manage Contracts</h5>
        <span class="p-input-icon-left">
          <i class="pi pi-search"></i>
          <!-- <input pInputText type="text" (input)="dt.filterGlobal($event.target.value, 'contains')" placeholder="Search..." /> -->
        </span>
      </div>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 4rem">
          <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
        </th>
        <th pSortableColumn="id" style="min-width: 5rem">
          Id<p-sortIcon field="id"></p-sortIcon>
        </th>
        <th pSortableColumn="startDate">
          Start_Date<p-sortIcon field="startDate"></p-sortIcon>
        </th>
        <th pSortableColumn="contractType" style="min-width: 10rem">
          Gross_Salary<p-sortIcon field="grossSalary"></p-sortIcon>
        </th>
        <th pSortableColumn="duration ">
          Contract_Type <p-sortIcon field="contractType"></p-sortIcon>
        </th>
        <th pSortableColumn="inventoryStatus" style="min-width: 10rem">
          Duration <p-sortIcon field="duration"></p-sortIcon>
        </th>
        <th>Action</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-contract>
      <tr>
        <td><p-tableCheckbox [value]="contract"></p-tableCheckbox></td>
        <td>{{ contract.id }}</td>
        <td>{{ contract.startDate }}</td>
        <td>{{ contract.grossSalary }}</td>
        <td>{{ contract.contractType }}</td>
        <td>{{ contract.duration }}</td>
        <td>
          <button
            pButton
            pRipple
            icon="pi pi-pencil"
            class="p-button-rounded p-button-success mr-2"
            style="margin-right: 10px;"
          ></button>
          <button
            pButton
            pRipple
            icon="pi pi-trash"
            class="p-button-rounded p-button-warning"
          ></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="summary">
      <div class="flex align-items-center justify-content-between">
        In total there are {{ contracts ? contracts.length : 0 }} contracts.
      </div>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [(visible)]="productDialog"
  [style]="{ width: '450px' }"
  header="contarct Details"
  [modal]="true"
  styleClass="p-fluid"
>
  <ng-template pTemplate="content">
    <div>
      <div class="field col-12 md:col-4">
        <span class="p-float-label">
          <!-- <p-multiSelect inputId="multiselect" [options]="cities"  optionLabel="name" [filter]="false"></p-multiSelect> -->
          <label for="multiselect">MultiSelect</label>
        </span>
      </div>
    </div>
    <div class="field">
      <label for="dateformat">startDate</label>
      <p-calendar
        [style]="{ width: '10px' }"
        dateFormat="yyyy-mm-dd"
        inputId="dateformat"
        [showIcon]="true"
        inputId="icon"
        styleClass="p-fluid"
        [inline]="true"
      ></p-calendar>
    </div>
  </ng-template>

  <ng-template pTemplate="footer">
    <button
      pButton
      pRipple
      label="Cancel"
      icon="pi pi-times"
      class="p-button-text"
      (click)="hideDialog()"
    ></button>
    <button
      pButton
      pRipple
      label="Save"
      icon="pi pi-check"
      class="p-button-text"
    ></button>
  </ng-template>
</p-dialog>

<p-confirmDialog [style]="{ width: '450px' }"></p-confirmDialog>
