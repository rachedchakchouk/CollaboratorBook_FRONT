<p-toast></p-toast>
<div class="card">
  <h4>New Contract</h4>
  <div class="card">
    <div class="p-fluid grid formgrid">
      <form [formGroup]="contractForm">
        <div class="row">
          <div class="col-sm-6">
            <label for="dateformat" class="label">Start date <span style="color: red;">* </span></label>
            <p-calendar formControlName="startDate" dateFormat="yy-mm-dd" inputId="dateformat"></p-calendar>
          </div>


          <div class="col-sm-6">
            <label>grossSalary</label>

            <p-inputNumber inputId="minmaxfraction" mode="decimal" [minFractionDigits]="3" [maxFractionDigits]="5"
              formControlName="grossSalary">
            </p-inputNumber>
          </div>



          <div class="col-sm-6">
            <label>Net Salary</label>
            <p-inputNumber inputId="minmaxfraction" mode="decimal" [min]="0" [max]="5000" [maxFractionDigits]="3">
            </p-inputNumber>
          </div>

          <div class="col-sm-6">
            <h5>Contract Type</h5>
            <p-dropdown id="type" placeholder="Select a contract type" formControlName="contractType"
              (onChange)="onChangeContractType($event)" [options]="type" [showClear]="true"></p-dropdown>


          </div>
          <div class="col-sm-6">
            <h5>Contract Duration</h5>
            <p-dropdown id="duree" placeholder="Select a contract duration" [options]="duration"
              formControlName="duration" (onChange)="onChangeDuration($event)" [showClear]="true"
              [disabled]="f_duratin">
            </p-dropdown>
          </div>
        </div>
      </form>
      <div class="p-fluid grid formgrid">
        <p-table #dt [value]="clauses" [rows]="5" [paginator]="true" [globalFilterFields]="['title', 'description']"
          [tableStyle]="{ 'min-width': '75rem' }" [(selection)]="selectedclauses" [rowHover]="true" dataKey="id"
          currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
          [showCurrentPageReport]="true">
          <ng-template pTemplate="caption">
            <div class="flex align-items-center justify-content-between">
              <h5 class="m-0">Select clauses</h5>
            </div>
          </ng-template>
          <ng-template pTemplate="header">
            <tr>
              <th style="width: 4rem">
                <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
              </th>
              <th pSortableColumn="id" style="min-width: 5rem">
                title<p-sortIcon field="title"></p-sortIcon>
              </th>
              <th pSortableColumn="startDate">description</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-clause>
            <tr>
              <td>
                <p-tableCheckbox [value]="clause"></p-tableCheckbox>
              </td>
              <td>{{ clause.title }}</td>
              <td>{{ clause.description }}</td>
            </tr>
          </ng-template>
          <ng-template pTemplate="footer">
            <button pButton icon="pi pi-plus" label="clause" class="p-button-link"
              (click)="openDialogAddClause()"></button>
          </ng-template>
        </p-table>

        <div class="buttons">
          <button class="btn btn-danger" style="float: left;">Cancel</button>

          <button class="btn btn-success" style="float: right;" (click)="addContract()">Add</button>
        </div>
      </div>
    </div>
  </div>
</div>

<p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>
